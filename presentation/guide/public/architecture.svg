<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">DSH 实习插件主要调用方向</title>
  <desc id="desc">用户进入 DSH 与模型，调用插件 JS 工具，由 Python 后端保存 SQLite 数据。教学示意。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68ddd0" stroke-width="1.5"/></marker></defs>
  <g fill="none" stroke="#68ddd0" stroke-width="2" marker-end="url(#arrow)">
    <path d="M120 100H178"/><path d="M350 100H408"/><path d="M580 100H638"/><path d="M810 100H868"/>
  </g>
  <g fill="#edf2f7" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle" font-size="24">
    <text x="65" y="108">用户</text><text x="265" y="108">DSH 与模型</text><text x="495" y="108">插件 JS</text><text x="725" y="108">Python</text><text x="935" y="108">SQLite</text>
  </g>
  <g fill="#aebfd3" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle" font-size="17">
